name: Daily site monitor

on:
  schedule:
    # Runs once a day at 08:20 UTC. Adjust if you prefer another time.
    - cron: "20 8 * * *"
  workflow_dispatch:

jobs:
  check-site:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      BASE_URL: ${{ vars.BASE_URL || 'https://greek-clothing-store.vercel.app' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: Run site monitor
        run: npm run check:site

      - name: Upload monitor report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: site-monitor-report
          path: automation-reports/
          if-no-files-found: ignore
