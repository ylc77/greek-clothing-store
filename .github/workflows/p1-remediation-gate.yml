name: P1 remediation gate

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: p1-remediation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  NEXT_TELEMETRY_DISABLED: "1"
  SUPABASE_TELEMETRY_DISABLED: "1"
  USE_POS_RPC: "true"
  USE_PRODUCT_RPC: "true"
  USE_CSV_IMPORT_RPC: "true"

jobs:
  static-quality:
    name: Static quality and dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check changed-line whitespace
        shell: bash
        run: |
          set -euo pipefail
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          if [ -n "$BASE_SHA" ]; then
            git diff --check "$BASE_SHA"...HEAD
          else
            git diff --check HEAD^...HEAD
          fi

      - name: Verify migrations, generated snapshot, feature gates, and tracked env files
        run: |
          npm run check:p1-static
          npm run check:product-static
          npm run check:category-static
          npm run check:csv-static
          npm run check:public-data-static
          npm run check:storage-static
          npm run check:ai-auth-static
          npm run check:channels-static
          npm run check:operations-static

      - name: Regenerate client snapshot and require zero drift
        run: |
          npm run db:snapshot
          git diff --exit-code -- supabase/client-init.sql

      - name: Typecheck
        run: npm run typecheck

      - name: Production build with local-only public placeholders
        env:
          NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3314
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-public-placeholder
          USE_POS_RPC: "true"
          USE_PRODUCT_RPC: "true"
          USE_CSV_IMPORT_RPC: "true"
        run: npm run build

      - name: Scan source and browser bundle for credentials
        run: npm run test:developer-secrets

      - name: Dependency audit
        shell: bash
        run: |
          set -euo pipefail
          npm audit --json > "$RUNNER_TEMP/npm-audit.json" || true
          node scripts/check-npm-audit.mjs "$RUNNER_TEMP/npm-audit.json"

      - name: Upload dependency audit report
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: npm-audit-report
          path: ${{ runner.temp }}/npm-audit.json
          if-no-files-found: ignore
          retention-days: 7

  unit-tests:
    name: P1 unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run operation ID, credential, Feature Gate, and product unit tests
        run: |
          npm run test:p1-unit
          npm run test:product-unit
          npm run test:csv-unit
          npm run test:public-data-unit
          npm run test:storage-unit
          npm run test:ai-auth-unit
          npm run test:channels-unit
          npm run test:operations-unit

  local-supabase-integration:
    name: Local Supabase integration and security
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup pinned Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Start isolated local Supabase
        shell: bash
        run: |
          set -euo pipefail
          if ! supabase start -x studio,meta,analytics,vector,realtime,inbucket,imgproxy,edge-runtime,functions > "$RUNNER_TEMP/supabase-start.log" 2>&1; then
            echo "::error::Local Supabase failed to start. Credential-bearing startup output is intentionally not printed or uploaded."
            exit 1
          fi

      - name: Reset migration chain from zero
        run: supabase db reset --local --no-seed

      - name: Run POS, inventory, developer credential, Feature Gate, and product integration tests
        run: |
          npm run test:p1-integration
          npm run test:product-integration
          npm run test:category-integration
          npm run test:csv-integration
          npm run test:csv-routes
          npm run test:public-data-integration
          npm run test:storage-integration
          npm run test:ai-auth-integration
          npm run test:legal-publish-integration
          npm run test:operations-integration

      - name: Verify RPC grants, RLS, and SECURITY DEFINER search paths
        run: |
          npm run check:p1-db-security
          npm run check:product-db-security
          npm run check:csv-db-security
          npm run check:public-data-db-security
          npm run check:storage-db-security
          npm run check:ai-auth-db-security
          npm run check:operations-db-security

      - name: Run local database advisors
        run: supabase db advisors --local

      - name: Install Chromium for channel browser gates
        run: npx playwright install --with-deps chromium

      - name: Run localized SEO, legal, security-header, and accessibility browser gates
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env 2>/dev/null)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export NEXT_PUBLIC_SUPABASE_ANON_KEY="$ANON_KEY"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          export NEXT_PUBLIC_SITE_URL="http://127.0.0.1:3010"
          export BASE_URL="$NEXT_PUBLIC_SITE_URL"
          export USE_POS_RPC="true"
          export USE_PRODUCT_RPC="true"
          export USE_CSV_IMPORT_RPC="true"
          export AUTH_RATE_LIMIT_SECRET="$(openssl rand -hex 32)"
          export ADMIN_PASSWORD="CiOwner!A1$(openssl rand -hex 24)"
          export ADMIN_STAFF_PASSWORD="CiStaff!A1$(openssl rand -hex 24)"
          export ADMIN_INVENTORY_PASSWORD="CiInventory!A1$(openssl rand -hex 24)"
          export ADMIN_READONLY_PASSWORD="CiReadonly!A1$(openssl rand -hex 24)"
          export EXPECT_DYNAMIC_CATEGORY_FIXTURE="true"
          SERVER_PID=""
          cleanup() {
            if [ -n "$SERVER_PID" ]; then
              kill "$SERVER_PID" >/dev/null 2>&1 || true
            fi
            supabase db query --local "delete from public.product_categories where id in ('90000000-0000-4000-8000-000000000001'::uuid, '90000000-0000-4000-8000-000000000002'::uuid);" >/dev/null 2>&1 || true
            rm -f "$RUNNER_TEMP/channels-next.log"
          }
          trap cleanup EXIT
          supabase db query --local "with inserted_categories as (insert into public.product_categories (id,slug,name_cn,name_en,name_gr,image_url,sort_order,is_active) values ('90000000-0000-4000-8000-000000000001','seasonal','季节限定','Seasonal','Εποχιακά','',90,true), ('90000000-0000-4000-8000-000000000002','essentials','基础款','Essentials','Βασικά','',91,true) returning id) insert into public.product_subcategories (id,category_id,slug,name_cn,name_en,name_gr,sort_order,is_active) select '91000000-0000-4000-8000-000000000001','90000000-0000-4000-8000-000000000001','seasonal-sale','季节折扣','Seasonal sale','Εποχιακές εκπτώσεις',1,true from inserted_categories where id = '90000000-0000-4000-8000-000000000001'::uuid;"
          npm run build
          npm run start -- -p 3010 > "$RUNNER_TEMP/channels-next.log" 2>&1 &
          SERVER_PID=$!
          for attempt in $(seq 1 45); do
            if curl --fail --silent --show-error "http://127.0.0.1:3010/" >/dev/null; then
              break
            fi
            if ! kill -0 "$SERVER_PID" >/dev/null 2>&1; then
              echo "::error::Next.js exited before browser verification. Runtime log is intentionally not uploaded."
              exit 1
            fi
            if [ "$attempt" -eq 45 ]; then
              echo "::error::Next.js did not become ready before browser verification."
              exit 1
            fi
            sleep 1
          done
          npm run test:channels-browser
          npm run test:operations-browser

      - name: Exercise database and Storage backup restore
        run: npm run test:operations-backup-restore

      - name: Verify reconciliation and test cleanup
        shell: bash
        run: |
          set -euo pipefail
          eval "$(supabase status -o env 2>/dev/null)"
          export NEXT_PUBLIC_SUPABASE_URL="$API_URL"
          export SUPABASE_SERVICE_ROLE_KEY="$SERVICE_ROLE_KEY"
          npm run storage:reconcile -- --project-ref clothing_web --test-local
          npm run check:p1-cleanup

      - name: Stop isolated local Supabase
        if: always()
        shell: bash
        run: |
          supabase stop --no-backup >/dev/null 2>&1 || true
          rm -f "$RUNNER_TEMP/supabase-start.log"

  installation-paths:
    name: Clean, client-init, and legacy upgrade paths
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify POS, inventory, developer credential, and product install paths
        run: |
          npm run test:p1-install-paths
          npm run test:product-install-paths
          npm run test:category-install-paths
          npm run test:csv-install-paths
          npm run test:public-data-install-paths
          npm run test:storage-install-paths
          npm run test:ai-auth-install-paths
          npm run test:operations-install-paths
      - name: Verify ordered migration snapshot
        run: |
          npm run check:p1-static
          npm run check:product-static
          npm run check:category-static
          npm run check:csv-static
          npm run check:public-data-static
          npm run check:storage-static
          npm run check:ai-auth-static
          npm run check:channels-static
          npm run check:operations-static
